<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    a = parseInt(prompt("Enter first number"))
    b = parseInt(prompt("Enter second number"))
    s = (prompt("Enter the sign(+,-,*,/)"))
    if(s=="+") {
      alert("Sum="+ (a+b))
    }
    else if(s=="-") {
      alert("Sub=" + (a-b))
    }
    else if(s=="*") {
      alert("Mul=" + (a*b))
    }
    else if(s=="/"){
      alert("Div=" + (a/b))
    }
  </script>
</body>
</html>
