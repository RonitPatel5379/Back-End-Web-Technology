<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    n = parseInt(prompt("Enter a number"))
    rev=0,num=n
    while(n!=0) {
      rem=n%10
      rev = rev*10 + rem
      n=parseInt(n/10)
    }
    if(num==rev) {
      alert("Palindrome Number")
    }
    else {
      alert("Not Palindrome Number")
    }
  </script>
</body>
</html>
